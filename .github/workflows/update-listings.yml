name: Update listings
on:
  schedule:
    - cron: "15 4 * * *"   # every day 06:15/07:15 Athens
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch team listings from remax-deltaktima.gr
        run: python scripts/fetch_listings.py data/listings.json
      - name: Commit if changed
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet -- data/listings.json; then echo "no change"; exit 0; fi
          # ignore a change that is only the timestamp
          if [ "$(git diff --cached --numstat -- data/listings.json | awk '{print $1+$2}')" -le 2 ]; then git reset -q; echo "only timestamp"; exit 0; fi
          git commit -m "Update team listings"
          git push
